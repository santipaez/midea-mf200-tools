name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile every script
        run: python -m compileall -q tools mf200
      - name: Run the frame and demo tests
        run: python -m unittest discover -s tests -t .
      - name: Fail if a device key or a vendor package slipped in
        run: |
          if git ls-files | grep -E 'credentials\.json|\.lua$|\.zip$|^\.env$'; then
            echo "::error::a file that must stay local is tracked"
            exit 1
          fi
