<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d">
  <title id="t">MF200 frame layout, one cell per byte</title>
  <desc id="d">The status frame has 52 bytes and exposes fresh air at index 29, bit 6. The control frame has 22 bytes, with steam at index 16 bit 4 and the fresh air write at index 19 bit 0. Options that must not change are sent as 0xFF.</desc>

  <rect width="900" height="380" fill="#ffffff"/>
  <text x="40" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Two frames, two layouts</text>
  <text x="40" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">The same feature sits at a different index depending on direction. That asymmetry is the whole trap.</text>

  <text x="40" y="112" font-family="IBM Plex Mono, monospace" font-size="11" fill="#0f172a">STATUS</text>
  <text x="40" y="128" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b">52 bytes</text>
  <text x="764" y="121" font-family="IBM Plex Mono, monospace" font-size="9" fill="#64748b">body[51]</text>

