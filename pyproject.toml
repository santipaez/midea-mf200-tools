[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mf200"
version = "0.1.0"
description = "Local control layer for the Midea MF200 washer-dryer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Santiago Paez" }]
dependencies = []

[project.optional-dependencies]
# Only needed for the real device (run/status). The frame builder and the
# demo have no third-party dependency.
device = ["midea-local>=1.1.0"]

[project.scripts]
mf200 = "mf200.cli:main"

[tool.setuptools]
packages = ["mf200"]

[tool.setuptools.package-data]
mf200 = ["web/*.html"]
